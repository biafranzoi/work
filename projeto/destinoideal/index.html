<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <!-- Endereço antigo do case: o projeto se chamava DestinoIdeal e agora se
         chama Boralá! (ver a seção "A mudança de escopo" no case). Esta pasta
         fica no ar só para os links já compartilhados continuarem funcionando:
         ela manda o visitante para o portfólio com o slug novo, e a barra de
         endereço termina em /projeto/borala/. O endereço vigente do case é
         projeto/borala/index.html. -->

    <title>Boralá! (antes DestinoIdeal) · Bia Franzoi</title>
    <meta name="description" content="Planejador de viagens que parte de onde a pessoa está: ela diz de onde sai e quanto tempo aceita viajar, e a lista de destinos possíveis se monta na hora." />
    <link
      rel="canonical"
      href="https://biafranzoi.github.io/work/projeto/borala/"
    />

    <!-- Open Graph (preview ao compartilhar o link) -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Bia Franzoi" />
    <meta property="og:title" content="Boralá! — Bia Franzoi" />
    <meta property="og:description" content="Planejador de viagens que parte de onde a pessoa está: ela diz de onde sai e quanto tempo aceita viajar, e a lista de destinos possíveis se monta na hora." />
    <meta
      property="og:url"
      content="https://biafranzoi.github.io/work/projeto/borala/"
    />
    <!-- imagem compartilhada por todos os cases; para dar uma só a este
         projeto, troque por um arquivo 1200x630 próprio -->
    <meta
      property="og:image"
      content="https://biafranzoi.github.io/work/src/img/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bia Franzoi — Lead Design Engineer" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boralá! — Bia Franzoi" />
    <meta name="twitter:description" content="Planejador de viagens que parte de onde a pessoa está: ela diz de onde sai e quanto tempo aceita viajar, e a lista de destinos possíveis se monta na hora." />
    <meta
      name="twitter:image"
      content="https://biafranzoi.github.io/work/src/img/og-image.png"
    />
    <meta name="twitter:image:alt" content="Bia Franzoi — Lead Design Engineer" />

    <link rel="icon" type="image/png" href="../../src/img/biafranzoi-logo.png" />

    <!-- mesma cor de fundo do site: sem isso o salto para o portfólio pisca
         branco -->
    <style>
      html {
        background: #0b0f0d;
        color: #e7efe9;
        font-family: system-ui, sans-serif;
      }
      p {
        margin: 3rem;
        text-align: center;
      }
      a {
        color: #4ade80;
      }
    </style>

    <script>
      // A raiz é calculada, e não fixa, porque o site roda em "/" no servidor
      // local e em "/work/" no GitHub Pages — e porque o endereço pode chegar
      // com ou sem a barra final. replace() em vez de href: a volta do
      // navegador não deve cair de novo aqui.
      (function () {
        var root = location.pathname.replace(/projeto\/[^/]*\/?$/, "");
        location.replace(root + "?projeto=borala" + location.hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=../../?projeto=borala" />
    </noscript>
  </head>
  <body>
    <p>Abrindo <strong>Boralá!</strong>… <a href="../../?projeto=borala">continuar</a></p>
  </body>
</html>
