<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />

    <!-- Página de erro do GitHub Pages: servida em QUALQUER caminho que não
         exista (ex.: /work/projeto/slug-errado/). Por isso ela não usa nada
         relativo — o CSS é inline e os links são absolutos (ou montados pelo
         script no fim do <body>): um href relativo seria resolvido a partir
         da pasta inexistente que o visitante tentou abrir. -->

    <title>Página não encontrada · Bia Franzoi</title>

    <!-- absoluto pelo mesmo motivo do botão: a página roda em qualquer caminho -->
    <link
      rel="icon"
      type="image/png"
      href="https://biafranzoi.github.io/work/src/img/biafranzoi-logo.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <style>
      /* Tokens: cópia enxuta dos 3 temas do src/style.css — só o que esta
         página usa. Se os tokens de lá mudarem, estes aqui também precisam. */
      :root {
        color-scheme: dark;
        --bg: #0b0f0d;
        --border-interactive: #526558;
        --text: #e8efeb;
        --text-muted: #9db0a7;
        --accent: #2bd17e;
        --accent-strong: color-mix(in srgb, var(--accent) 80%, black);
        --accent-contrast: #06130c;
        /* halo verde atrás da ilustração */
        --art-glow: 16%;
        /* cores da cena: no tema escuro acompanham os tokens do site */
        --planet: var(--accent);
        --star: var(--text);
        --focus-width: 2px;
        --radius: 12px;
        --font-sans:
          "Space Grotesk", "Segoe UI", system-ui, -apple-system, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --fs-sm: 0.875rem;
        --fs-base: 1rem;
        --fs-xl: clamp(1.75rem, 1.1rem + 3vw, 2.5rem);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f5f7f5;
        --border-interactive: #7d8f85;
        --text: #101a15;
        --text-muted: #47584e;
        --accent: #0c6338;
        --accent-contrast: #ffffff;
        /* sobre o fundo quase branco, o mesmo halo vira uma mancha cinza — o
           verde do tema claro é escuro (#0c6338), não luminoso */
        --art-glow: 10%;
        /* a cena não segue o tema aqui: o planeta e as estrelas ficam no verde
           luminoso do tema escuro (#2bd17e). O verde do tema claro é escuro
           demais pro planeta, e estrelas na cor do texto virariam pontinhos
           pretos em vez de céu */
        --planet: #2bd17e;
        --star: #2bd17e;
      }

      :root[data-theme="high-contrast"] {
        color-scheme: dark;
        --bg: #000000;
        --border-interactive: #ffffff;
        --text: #ffffff;
        --text-muted: #d6d6d6;
        --accent: #35e28f;
        --accent-contrast: #000000;
        --focus-width: 3px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem 3rem;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--fs-base);
        line-height: 1.6;
        text-align: center;
        overflow-x: hidden;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 1.25rem;
        max-width: 34rem;
      }

      h1 {
        font-size: var(--fs-xl);
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .lead {
        color: var(--text-muted);
        text-wrap: pretty;
      }

      /* ---------- Ilustração: um céu, com o "0" do 404 como planeta --------
         Nada de imagem. O céu é SVG, porque estrelas e constelações pedem
         coordenada exata: o campo de fundo é aleatório (com semente fixa),
         mas Órion, Cruzeiro do Sul e Ursa Maior têm as posições relativas
         reais, e o raio de cada estrela acompanha o brilho dela. O planeta
         é CSS. O que se move: as estrelas piscando, as quatro cadentes e as
         faixas de gás do planeta — tudo em loop, sem fim. */
      .art {
        --size: clamp(4.5rem, 19vw, 9.5rem);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.35rem, 1.5vw, 1rem);
        margin-bottom: 0.5rem;
      }

      /* halo difuso atrás de tudo, na mesma linguagem do glow do botão */
      .glow {
        position: absolute;
        inset: -40% -10%;
        z-index: -2;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          color-mix(in srgb, var(--planet) var(--art-glow), transparent),
          transparent
        );
        animation: breathe 6s ease-in-out infinite;
      }

      .digit {
        font-size: var(--size);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      /* ---- a galáxia ---- */
      .galaxy {
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        /* bem mais larga que a tipografia: se a galáxia terminasse junto com
           o texto, viraria um retângulo de fundo em vez de uma cena */
        width: 232%;
        aspect-ratio: 600 / 320;
        translate: -50% -50%;
      }

      /* nebulosa difusa atrás do planeta: dá profundidade ao céu sem
         competir com as estrelas */
      .core {
        fill: var(--planet);
        opacity: 0.14;
        filter: blur(26px);
      }

      /* --o (brilho), --d (atraso) e --t (duração) vêm inline, um valor por
         estrela: é o que faz cada uma pulsar no seu próprio ritmo, em vez de
         o céu inteiro piscar junto */
      .star {
        --o: 0.6;
        --t: 4.5s;
        fill: var(--star);
        opacity: calc(var(--o) * var(--brilho, 1));
        animation: twinkle var(--t) ease-in-out infinite;
        animation-delay: var(--d);
      }

      /* as estrelas das constelações são as mesmas do campo, só que com o
         raio e o brilho vindo da magnitude real de cada uma — é o que deixa
         Órion, Cruzeiro do Sul e Ursa Maior reconhecíveis sem nenhuma linha
         ligando os pontos */
      .star--named {
        fill: var(--star);
        /* um halo discreto destaca as estrelas nomeadas do campo atrás,
           que é o que deixa o desenho da constelação legível */
        filter: drop-shadow(0 0 4px color-mix(in srgb, var(--star) 55%, transparent));
        /* pisca menos que as outras: se a estrela de uma constelação some
           por um instante, o desenho dela deixa de ser reconhecível */
        animation-name: twinkle-named;
      }

      /* paradas do gradiente do rastro: como atributo não dá pra usar var() */
      .g-lit {
        stop-color: var(--star);
      }

      /* verde claro sobre o fundo quase branco rende bem menos que branco
         sobre o escuro: no tema claro as estrelas precisam de mais opacidade
         para aparecerem com o mesmo peso */
      :root[data-theme="light"] .star {
        --brilho: 1.5;
      }

      .g-zero {
        stop-color: var(--star);
        stop-opacity: 0;
      }

      .shoot {
        opacity: 0;
        animation: shoot 20s linear infinite;
        /* o atraso de cada risco vem inline: é ele que espalha as quatro
           estrelas cadentes no ciclo, uma a cada 5s */
        animation-delay: var(--d);
      }

      /* ---- o planeta, que é o "0" ---- */
      .planet {
        position: relative;
        width: calc(var(--size) * 0.72);
        aspect-ratio: 1;
        flex-shrink: 0;
      }

      /* o "0" é o planeta inteiro: sem contorno de número, quem ocupa o lugar
         do zero é o próprio globo. A esfera vem de três camadas — o degradê
         da luz no fundo, as faixas de gás deslizando por cima (::before) e a
         sombra do lado oposto à luz por último (::after), que é o que dá o
         volume. O brilho pra fora separa o planeta do céu. */
      .globe {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        border-radius: 50%;
        background:
          radial-gradient(
            circle at 30% 25%,
            color-mix(in srgb, var(--planet) 88%, white),
            color-mix(in srgb, var(--planet) 72%, transparent) 45%,
            color-mix(in srgb, var(--planet) 30%, transparent) 82%,
            color-mix(in srgb, var(--planet) 16%, transparent)
          ),
          var(--bg);
        box-shadow: 0 0 36px color-mix(in srgb, var(--planet) 30%, transparent);
      }

      .globe::before {
        content: "";
        position: absolute;
        inset: -20%;
        background: repeating-linear-gradient(
          173deg,
          transparent 0 6px,
          color-mix(in srgb, var(--planet) 22%, transparent) 6px 10px
        );
        /* o deslocamento da animação é igual ao período do padrão, então o
           loop não tem emenda */
        animation: bands 20s linear infinite;
      }

      /* preto fixo nos 3 temas, como os scrims que o site usa sobre foto */
      .globe::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 30% 24%,
          transparent 28%,
          rgb(0 0 0 / 0.55) 95%
        );
      }

      /* o anel é desenhado duas vezes: a cópia de trás fica escondida pelo
         globo (que é opaco), e a da frente aparece só da metade pra baixo —
         é isso que dá a volta completa em torno do planeta */
      .ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 150%;
        aspect-ratio: 1 / 0.28;
        translate: -50% -50%;
        rotate: -17deg;
        /* branco e proporcional ao planeta: em px fixo o anel ficaria grosso
           demais no celular, onde o "0" encolhe */
        border: max(2px, calc(var(--size) * 0.024)) solid
          color-mix(in srgb, var(--text) 88%, transparent);
        border-radius: 50%;
      }

      .ring--back {
        z-index: 0;
      }

      .ring--front {
        z-index: 2;
        clip-path: inset(50% 0 0 0);
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: calc(var(--o) * var(--brilho, 1));
        }
        50% {
          opacity: calc(var(--o) * var(--brilho, 1) * 0.32);
        }
      }

      @keyframes twinkle-named {
        0%,
        100% {
          opacity: calc(var(--o) * var(--brilho, 1));
        }
        50% {
          opacity: calc(var(--o) * var(--brilho, 1) * 0.55);
        }
      }

      /* o trajeto de cada estrela cadente vem inline (--x1/--y1 → --x2/--y2),
         sempre da esquerda para a direita. Ciclo de 20s em 4 riscos, com os
         atrasos dividindo esse ciclo: passa uma a cada 5s, sem parar */
      @keyframes shoot {
        0% {
          translate: var(--x1) var(--y1);
          opacity: 0;
        }
        2% {
          opacity: 1;
        }
        11% {
          translate: var(--x2) var(--y2);
          opacity: 0;
        }
        100% {
          translate: var(--x2) var(--y2);
          opacity: 0;
        }
      }

      @keyframes bands {
        to {
          translate: 0 -10px;
        }
      }

      @keyframes breathe {
        50% {
          opacity: 0.4;
        }
      }

      /* ---------- Botão (mesma linguagem do .button--primary do site) ----- */
      .button {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 1rem 1.5rem;
        border: 0;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-contrast);
        font-family: inherit;
        font-weight: 600;
        font-size: var(--fs-sm);
        text-decoration: none;
        box-shadow:
          0 0 16px color-mix(in srgb, var(--accent) 55%, transparent),
          0 0 32px color-mix(in srgb, var(--accent) 25%, transparent);
        transition:
          transform 0.2s ease,
          background-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-2px);
        background: var(--accent-strong);
        box-shadow:
          0 0 20px color-mix(in srgb, var(--accent) 70%, transparent),
          0 0 40px color-mix(in srgb, var(--accent) 35%, transparent);
      }

      a:focus-visible {
        outline: var(--focus-width) solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .star,
        .shoot,
        .globe::before,
        .glow {
          animation: none;
        }
        .button {
          transition: none;
        }
        .button:hover,
        .button:focus-visible {
          transform: none;
        }
      }
    </style>

    <script>
      // aplica o tema salvo antes da primeira pintura, pra não piscar o tema
      // errado por uma fração de segundo (mesmo script do index.html)
      (function () {
        try {
          var saved = localStorage.getItem("biafranzoi-theme");
          if (saved === "light" || saved === "high-contrast") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        // Respeita o idioma escolhido no portfólio (mesma chave do i18n.js).
        // O português é o que está escrito no HTML; só o inglês precisa de
        // tradução, guardada em data-en — mesma ideia do resto do site.
        try {
          if (localStorage.getItem("biafranzoi-lang") === "en") {
            document.documentElement.lang = "en";
            document.title = "Page not found · Bia Franzoi";
            document.querySelectorAll("[data-en]").forEach(function (el) {
              el.textContent = el.dataset.en;
            });
          }
        } catch (e) {}
      })();
    </script>
